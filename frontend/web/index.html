  <style>
    html, body {
      margin: 0;

    /* PWA Splash screen styling */
    #loading-indicator {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 50%, #2563EB 100%);
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    #loading-indicator.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #loading-indicator .app-name {
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-top: 24px;
    }
    #loading-indicator .app-subtitle {
      color: rgba(255,255,255,0.6);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      margin-top: 8px;
    }
    #loading-indicator .spinner {
      width: 28px;
      height: 28px;
      margin-top: 48px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!--
    JS Bridge untuk Geolocation Safari iOS.
    Safari hanya mengizinkan navigator.geolocation di main thread JS,
    bukan dari Flutter CanvasKit worker. Fungsi ini dipanggil dari Flutter
    via js_interop dan meneruskan hasilnya lewat callback.
  -->
  <script>
    // Dipanggil dari Flutter saat user tap tombol (masih dalam gesture scope).
    // successCallback(lat, lng) dan errorCallback(code, message) adalah
    // fungsi Dart yang di-wrap sebagai JSFunction.
    window.getLocationForFlutter = function(successCallback, errorCallback) {
      if (!navigator.geolocation) {
        errorCallback(0, 'Geolocation tidak didukung browser ini');
        return;
      }
      navigator.geolocation.getCurrentPosition(
        function(position) {
          successCallback(
            position.coords.latitude,
            position.coords.longitude
          );
        },
        function(error) {
          errorCallback(error.code, error.message);
        },
        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    };
  </script>
</head>
<body>
  <!-- PWA Loading / Splash Screen -->
  <div id="loading-indicator">

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Hide loading indicator once Flutter app is ready
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function() { loader.remove(); }, 500);
      }
    });
  </script>
