<!DOCTYPE html>
<html lang="id">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="SiAbsen — Sistem Absensi Karyawan. Checkin, checkout, izin, dan laporan realtime.">

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#1E3A8A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SiAbsen">
  <meta name="application-name" content="SiAbsen">
  <meta name="msapplication-TileColor" content="#1E3A8A">

  <!-- iOS Icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SiAbsen — Sistem Absensi Karyawan</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0F172A;
    }
    /* PWA Splash screen styling */
    #loading-indicator {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1E3A8A 0%, #1E40AF 50%, #2563EB 100%);
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    #loading-indicator.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #loading-indicator .app-name {
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-top: 24px;
    }
    #loading-indicator .app-subtitle {
      color: rgba(255,255,255,0.6);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      margin-top: 8px;
    }
    #loading-indicator .spinner {
      width: 28px;
      height: 28px;
      margin-top: 48px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!--
    JS Bridge untuk Geolocation Safari iOS.
    Safari hanya mengizinkan navigator.geolocation di main thread JS,
    bukan dari Flutter CanvasKit worker. Fungsi ini dipanggil dari Flutter
    via js_interop dan meneruskan hasilnya lewat callback.
  -->
  <script>
    // Dipanggil dari Flutter saat user tap tombol (masih dalam gesture scope).
    // successCallback(lat, lng) dan errorCallback(code, message) adalah
    // fungsi Dart yang di-wrap sebagai JSFunction.
    window.getLocationForFlutter = function(successCallback, errorCallback) {
      if (!navigator.geolocation) {
        errorCallback(0, 'Geolocation tidak didukung browser ini');
        return;
      }
      navigator.geolocation.getCurrentPosition(
        function(position) {
          successCallback(
            position.coords.latitude,
            position.coords.longitude
          );
        },
        function(error) {
          errorCallback(error.code, error.message);
        },
        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    };
  </script>
</head>
<body>
  <!-- PWA Loading / Splash Screen -->
  <div id="loading-indicator">
    <div class="app-name">SiAbsen</div>
    <div class="app-subtitle">Sistem Absensi Karyawan</div>
    <div class="spinner"></div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Hide loading indicator once Flutter app is ready
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function() { loader.remove(); }, 500);
      }
    });
  </script>
</body>
</html>
